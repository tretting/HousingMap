<!DOCTYPE html>
<html>
<head>
    <title>Housing Metric Mapping</title>
    <!-- Pin to an explicit v2.x release -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.1.0/chroma.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
</head>
<body>
    <div id="spinner">
        <div class="spinner-icon"></div>
    </div>
    <div id="sidebar">
        <h2>Colorado Springs Housing Explorer</h2>
        <div id="mode-switch">
            <button id="mode-metrics" class="button">Zipcode-level Metrics</button>
            <button id="mode-infill" class="button">Parcel-level Infill Scores</button>
        </div>
        <br><h3 id="label-data-type">Select Data</h3>
        <div id="data-type-container" class="select-container">
            <div class="radio-container">
                <input type="radio" id="change" name="data_type" value="change" checked>
                <label for="change">Change</label>
            </div>
            <div class="radio-container">
                <input type="radio" id="snapshot" name="data_type" value="snapshot">
                <label for="snapshot">Snapshot</label>
            </div>
        </div>
        <div class="select-container" id="change-type-container">
            <div class="radio-container">
                <input type="radio" id="total" name="change_type" value="total" checked>
                <label for="total">Total Change</label>
            </div>
            <div class="radio-container">
                <input type="radio" id="percent" name="change_type" value="percent">
                <label for="percent">Percent Change</label>
            </div>
        </div>

        <div id="metric-container" class="select-container">
            <label for="metric">Select Metric: </label>
            <select id="metric" name="metric"></select>
        </div><br>

        <div id="infill-container" class="select-container" style="display:none;">
            <label>Select Infill Score:</label><br/>
            <div class="radio-container">
              <input type="radio" id="infill-logit" name="infill" value="logistic" checked>
              <label for="infill-logit">Logistic</label>
            </div>
            <div class="radio-container">
              <input type="radio" id="infill-kfold" name="infill" value="kfold">
              <label for="infill-kfold">K-fold</label>
            </div>
          </div>

        <div class="date-container">
            <div id="start-date-container" class="select-container" style="display:inline-block;">
                <label for="date1">Start date: </label>
                <select id="date1" name="date1"></select>
            </div>
    
            <div id="end-date-container" class="select-container" style="display:inline-block; margin-left: 10px;">
                <label for="date2">End date: </label>
                <select id="date2" name="date2"></select>
            </div>
        </div>

        <button onclick="updateMap()">Update Map</button>
        <div id="info-container" class="info-container">
        </div>

    </div>
    <div id="map"></div>

    <script>
    // -------------------------------------------------------------
    // Global Variables
    // -------------------------------------------------------------
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const annual_start_year = 2011, annual_end_year = 2021;
    const monthly_start_year = 2000, monthly_end_year = 2023;
    let currentMetrics = null;

    // Cache elements
    const btnMetrics   = document.getElementById('mode-metrics');
    const btnInfill    = document.getElementById('mode-infill');
    const metricPane   = document.getElementById('metric-container');
    const datePane     = document.getElementById('start-date-container');
    const endDatePane  = document.getElementById('end-date-container');
    const changePane   = document.getElementById('change-type-container');
    const infillPane   = document.getElementById('infill-container');
    const dataTypeLabel= document.getElementById('label-data-type');
    const dataTypePane = document.getElementById('data-type-container');
    const infoContainer= document.getElementById('info-container');

    // -------------------------------------------------------------
    // Mode Switch Handlers
    // -------------------------------------------------------------
    btnMetrics.addEventListener('click', () => {
        btnMetrics.classList.add('active');
        btnInfill.classList.remove('active');

        metricPane.style.display     = 'block';
        dataTypeLabel.style.display  = 'block';
        dataTypePane.style.display   = 'block';
        changePane.style.display     = 'block';
        datePane.style.display       = 'inline-block';
        endDatePane.style.display    = document.getElementById('change').checked ? 'inline-block' : 'none';

        infillPane.style.display     = 'none';

        infoContainer.innerHTML = `
            <p>
                Use this tool to view housing-related or demographic-related info in Colorado Springs. Forecasts for the next 12 months of home value use SARIMA and LSTM models. Lot coverage is the average percentage of a lot covered by garage + first-floor area. “Change” vs “Snapshot” highlights % change vs period level. “ZVHI” is Zillow’s Home Value Index, and tags like “sfr” (single-family residence) or “2br” (two-bedroom) denote property types. Annual vs monthly denotes data frequency; gray areas mean no data. Dollar values are inflation-adjusted to 2021 USD. Map tiles by OpenStreetMap. Code on 
                <a href="https://github.com/tretting/HousingMap" target="_blank" class="orange-link">GitHub</a>.
            </p>
        `;
    });

    btnInfill.addEventListener('click', () => {
        btnInfill.classList.add('active');
        btnMetrics.classList.remove('active');

        metricPane.style.display     = 'none';
        dataTypeLabel.style.display  = 'none';
        dataTypePane.style.display   = 'none';
        changePane.style.display     = 'none';
        datePane.style.display       = 'none';
        endDatePane.style.display    = 'none';

        infillPane.style.display     = 'block';

        infoContainer.innerHTML = `
            <p>
                In “Infill Scores” mode pick logistic or k-fold scores for ADU suitability (only provided for plots currently zoned as single-family residential). Each method weights lot coverage, home equity, and land value to estimate permit likelihood. Higher = better candidate. Click “Update Map” to plot parcel points colored by score. Map tiles by OpenStreetMap.
            </p>
        `;
    });

    // -------------------------------------------------------------
    // Populate Dropdowns
    // -------------------------------------------------------------
    function populateMetrics(metrics) {
        currentMetrics = metrics;
        const sel = document.getElementById('metric');
        sel.innerHTML = '';

        const makeGroup = (label, items) => {
            const g = document.createElement('optgroup');
            g.label = label;
            items.forEach(m => {
                const o = document.createElement('option');
                o.value = m; o.text = m;
                g.appendChild(o);
            });
            return g;
        };

        sel.appendChild(makeGroup('Annual Metrics',   metrics.annual));
        sel.appendChild(makeGroup('Monthly Metrics',  metrics.monthly));
        if(metrics.custom?.length)   sel.appendChild(makeGroup('Custom Metrics',   metrics.custom));
        if(metrics.forecast?.length) sel.appendChild(makeGroup('Forecast Metrics', metrics.forecast));

        sel.addEventListener('change', () => handleMetricChange(sel.value));
    }

    function populateDates(el, type) {
        el.innerHTML = '<option value=""></option>';
        if(type==='annual') {
            for(let y=annual_start_year; y<=annual_end_year; y++) {
                el.innerHTML += `<option value="${y}">${y}</option>`;
            }
        } else {
            for(let y=monthly_start_year; y<=monthly_end_year; y++)
                for(let m=1; m<=12; m++)
                    el.innerHTML += `<option value="${y}-${String(m).padStart(2,'0')}">${months[m-1]} ${y}</option>`;
        }
    }

    function populateForecastDates(el) {
        el.innerHTML = '<option value=""></option>';
        fetch('/forecast_dates')
          .then(r=>r.json())
          .then(dates => dates.forEach(d => el.innerHTML += `<option value="${d}">${d}</option>`))
          .catch(console.error);
    }

    // -------------------------------------------------------------
    // Handle Metric → Show/Hide Date Controls
    // -------------------------------------------------------------
    function handleMetricChange(selectedMetric) {
        const startDiv      = document.getElementById('start-date-container');
        const endDiv        = document.getElementById('end-date-container');
        const changeDiv     = document.getElementById('change-type-container');
        const startSelect   = document.getElementById('date1');
        const endSelect     = document.getElementById('date2');
        const dataTypeValue = document.querySelector('input[name="data_type"]:checked').value;

        // determine category
        let dateType = 'custom';
        if (currentMetrics.forecast.includes(selectedMetric)) dateType = 'forecast';
        else if (currentMetrics.annual.includes(selectedMetric)) dateType = 'annual';
        else if (currentMetrics.monthly.includes(selectedMetric)) dateType = 'monthly';

        // clear previous options
        startSelect.innerHTML = '';
        endSelect.innerHTML   = '';

        if (dateType === 'custom') {
            startDiv.style.display  = 'none';
            endDiv.style.display    = 'none';
            changeDiv.style.display = 'none';
        }
        else if (dateType === 'forecast') {
            // only one selector
            populateForecastDates(startSelect);
            startDiv.style.display  = 'inline-block';
            endDiv.style.display    = 'none';
            changeDiv.style.display = 'none';
        }
        else {
            // annual or monthly → show both
            populateDates(startSelect, dateType);
            populateDates(endSelect,   dateType);

            startDiv.style.display  = 'inline-block';
            changeDiv.style.display = 'inline-block';
            endDiv.style.display    = dataTypeValue === 'change' ? 'inline-block' : 'none';
        }
        }

    // -------------------------------------------------------------
    // Core: updateMap() with OSM basemap
    // -------------------------------------------------------------
    async function updateMap() {
        const spinner = document.getElementById('spinner');
        spinner.classList.add('visible');
        try {
            const isInfill = btnInfill.classList.contains('active');
            if(isInfill) {
                const infillType = document.querySelector('input[name="infill"]:checked').value;
                const [shapeData, resp] = await Promise.all([
                    fetch('/data').then(r=>r.json()),
                    fetch(`/infill_scores?type=${infillType}`).then(r=>r.json())
                ]);
                const points = Array.isArray(resp)?resp:(resp.points||[]);
                const zipTraces = shapeData.features.map(f=>{
                    const coords=[];
                    (function ext(c){ Array.isArray(c[0])?c.forEach(ext):coords.push(c) })(f.geometry.coordinates);
                    return {
                        type:'scattermapbox',
                        lat: coords.map(c=>c[1]),
                        lon: coords.map(c=>c[0]),
                        mode:'lines',
                        line:{width:2,color:'lightgray'},
                        hoverinfo:'none'
                    };
                });
                const lats = points.map(d=>d.latitude),
                      lons = points.map(d=>d.longitude),
                      vals = points.map(d=>d.score),
                      sizes= points.map(d=>d.marker_size||6),
                      maxScore = Math.max(...vals,0);
                const parcelTrace = {
                    type:'scattermapbox',
                    lat:lats, lon:lons, mode:'markers',
                    marker:{ size:sizes, color:vals, colorscale:'Viridis', cmin:0, cmax:maxScore, colorbar:{title:`Score (${infillType})`} },
                    text:points.map(d=>d.text), hoverinfo:'text'
                };
                const layout = {
                    mapbox:{ style:'open-street-map', center:{lat:38.8339,lon:-104.8214}, zoom:9.5 },
                    height:1000, margin:{l:0,r:0,t:0,b:0}, showlegend:false
                };
                Plotly.react('map',[...zipTraces,parcelTrace],layout);
                return;
            }

            // non-infill branch
            const metric = document.getElementById('metric').value;
            const isCustom   = currentMetrics.custom.includes(metric);
            const isForecast = currentMetrics.forecast.includes(metric);

            if(isCustom && metric==='LotCoverage') {
                const lotData = await fetch('/lot_coverage_zipcode').then(r=>r.json());
                displayLotCoverageData(lotData);
                return;
            }

            // build update_data body
            const dataType   = document.querySelector('input[name="data_type"]:checked').value;
            const changeType = document.querySelector('input[name="change_type"]:checked').value;
            const date1      = document.getElementById('date1').value;
            const date2      = (!isForecast && dataType==='change') ? document.getElementById('date2').value : null;
            const body = {
                metric,
                data_type: dataType,
                date_type: isForecast?'forecast':(currentMetrics.annual.includes(metric)?'annual':'monthly'),
                start_date: date1,
                end_date: date2,
                change_type: changeType
            };
            const updateData = await fetch('/update_data', {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
            }).then(r=>r.json());

            const zipCodeData = {};
            updateData.forEach(item=>{ zipCodeData[item.RegionName]=item[metric]; });

            const shapeData = await fetch('/data').then(r=>r.json());
            const values    = Object.values(zipCodeData).filter(v=>v!=null&&!isNaN(v));
            const minValue = Math.min(...values), maxValue = Math.max(...values);
            const colorScale = chroma.scale(['cyan','yellow']).domain([0,1]);

            const traces = [];
            shapeData.features.forEach(f=>{
                const coords=[]; (function ext(c){ Array.isArray(c[0])?c.forEach(ext):coords.push(c) })(f.geometry.coordinates);
                const zip = f.properties.GEOID20;
                const value = zipCodeData[zip];
                const fillcolor = (value==null||isNaN(value))
                    ?'rgba(200,200,200,0.7)'
                    :colorScale((value-minValue)/(maxValue-minValue)).alpha(0.7).css();

                traces.push({
                    type:'scattermapbox',
                    lat:coords.map(c=>c[1]),
                    lon:coords.map(c=>c[0]),
                    mode:'lines',
                    fill:'toself',
                    fillcolor,
                    line:{width:2,color:'lightgray'},
                    hoverinfo:'none'
                });

                if(value!=null&&!isNaN(value)) {
                    const lat = +f.properties.INTPTLAT20, lon=+f.properties.INTPTLON20;
                    const txt = (dataType==='change'&&changeType==='percent')
                              ?`${value.toFixed(1)}%`
                              :value.toFixed(0);
                    traces.push({
                        type:'scattermapbox',
                        lat:[lat], lon:[lon],
                        mode:'markers',
                        marker:{size:5,color:'black'},
                        hoverinfo:'none'
                    },{
                        type:'scattermapbox',
                        lat:[lat], lon:[lon],
                        mode:'markers',
                        text:`Zipcode: ${zip}<br>${metric}: ${txt}`,
                        marker:{size:0,color:'rgba(0,0,0,0)'},
                        hoverinfo:'text'
                    });
                }
            });

            const layout2 = {
                mapbox:{ style:'open-street-map', center:{lat:38.8339,lon:-104.8214}, zoom:9.5 },
                height:1000, margin:{l:0,r:0,t:0,b:0}, showlegend:false
            };
            Plotly.newPlot('map', traces, layout2);
        }
        catch(err) {
            console.error('updateMap error:', err);
        }
        finally {
            spinner.classList.remove('visible');
        }
    }

    // -------------------------------------------------------------
    // Display Lot Coverage
    // -------------------------------------------------------------
    function displayLotCoverageData(data) {
        const zipCodeData = {};
        data.forEach(item => zipCodeData[item.ZIPCODE] = item.LotCoverage);

        fetch('/data')
          .then(r=>r.json())
          .then(shapeData => {
            const values = Object.values(zipCodeData).filter(v=>v!=null&&!isNaN(v));
            const minValue = Math.min(...values), maxValue = Math.max(...values);
            const colorScale = chroma.scale(['cyan','yellow']).domain([0,1]);
            const traces = [];

            shapeData.features.forEach(f=>{
                const coords=[]; (function ext(c){ Array.isArray(c[0])?c.forEach(ext):coords.push(c) })(f.geometry.coordinates);
                const zip = f.properties.GEOID20, value = zipCodeData[zip];
                const fillcolor = (value==null||isNaN(value))
                    ?'rgba(200,200,200,0.7)'
                    :colorScale((value-minValue)/(maxValue-minValue)).alpha(0.7).css();

                traces.push({
                    type:'scattermapbox',
                    lat:coords.map(c=>c[1]),
                    lon:coords.map(c=>c[0]),
                    mode:'lines',
                    fill:'toself',
                    fillcolor,
                    line:{width:2,color:'lightgray'},
                    hoverinfo:'none'
                });

                if(value!=null&&!isNaN(value)) {
                    const lat=+f.properties.INTPTLAT20, lon=+f.properties.INTPTLON20;
                    const txt = `${(value*100).toFixed(2)}%`;
                    traces.push({
                        type:'scattermapbox',
                        lat:[lat], lon:[lon],
                        mode:'markers',
                        marker:{size:5,color:'black'},
                        hoverinfo:'none'
                    },{
                        type:'scattermapbox',
                        lat:[lat], lon:[lon],
                        mode:'markers',
                        text:`Zipcode: ${zip}<br>Lot Coverage: ${txt}`,
                        marker:{size:0,color:'rgba(0,0,0,0)'},
                        hoverinfo:'text'
                    });
                }
            });

            const layout = {
                mapbox:{ style:'open-street-map', center:{lat:38.8339,lon:-104.8214}, zoom:9.5 },
                height:1000, margin:{l:0,r:0,t:0,b:0}, showlegend:false
            };
            Plotly.newPlot('map', traces, layout);
          })
          .catch(console.error);
    }

    // -------------------------------------------------------------
    // On Page Load
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
        const metricSelect   = document.getElementById('metric');
        const startDiv       = document.getElementById('start-date-container');
        const endDiv         = document.getElementById('end-date-container');
        const changeDiv      = document.getElementById('change-type-container');
        const startSelect    = document.getElementById('date1');
        const endSelect      = document.getElementById('date2');

        // 1) hide all date controls until a real metric is chosen
        startDiv.style.display  = 'none';
        endDiv.style.display    = 'none';
        changeDiv.style.display = 'none';

        // 2) when user toggles Change/Snapshot after picking a metric
        document
            .querySelectorAll('input[name="data_type"]')
            .forEach(radio =>
            radio.addEventListener('change', () => {
                if (metricSelect.value) handleMetricChange(metricSelect.value);
            })
            );

        // 3) fetch & populate the metric dropdown
        fetch('/metrics')
            .then(r => r.json())
            .then(metrics => {
            populateMetrics(metrics);

            // add a disabled “placeholder” option up top
            const placeholder = document.createElement('option');
            placeholder.text    = '⦿ Select a metric…';
            placeholder.value   = '';
            placeholder.disabled= true;
            placeholder.selected= true;
            metricSelect.prepend(placeholder);

            // wire up the select handler
            metricSelect.addEventListener('change', () => {
                handleMetricChange(metricSelect.value);
            });
            })
            .catch(console.error);

        // 4) draw the initial grey ZIP outlines
        fetch('/data')
            .then(r => r.json())
            .then(data => {
            const traces = data.features.map(f => {
                const coords = [];
                (function walk(c) {
                Array.isArray(c[0]) ? c.forEach(walk) : coords.push(c);
                })(f.geometry.coordinates);

                return {
                type: 'scattermapbox',
                lat: coords.map(c => c[1]),
                lon: coords.map(c => c[0]),
                mode: 'lines',
                line: { width: 2, color: 'lightgray' },
                hoverinfo: 'none'
                };
            });

            Plotly.newPlot('map', traces, {
                mapbox: {
                style: 'open-street-map',
                center: { lat: 38.8339, lon: -104.8214 },
                zoom: 9.5
                },
                height: 1000,
                margin: { l: 0, r: 0, t: 0, b: 0 },
                showlegend: false
            });
            })
            .catch(console.error);
        });

    </script>
</body>
</html>
